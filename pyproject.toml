[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental_impact"
version = "0.1.0"
description = "IncrementalImpact: Causal Uplift Modelling for Smarter Advertising"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lakshya Arora" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
